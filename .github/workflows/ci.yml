# Lint and unit tests on every push and pull request.

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dbus python3-gi shellcheck
          pipx install ruff

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test
